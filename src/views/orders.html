<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="nav"></div>
  <main class="max-w-4xl mx-auto p-4">
    <h1 class="text-2xl font-bold my-4">Mis pedidos</h1>
    <div id="msg" class="hidden"></div>
    <div id="orders" class="space-y-3"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    if (requireAuth()) load();
    async function load() {
      try {
        const data = await apiJson("/api/v1/orders");
        document.getElementById("orders").innerHTML = data.items.length ? data.items.map(o => `
          <div class="bg-white p-4 rounded shadow">
            <div class="flex justify-between flex-wrap gap-2">
              <span class="font-mono text-sm">${o.id}</span>
              <span class="px-2 py-0.5 rounded text-xs ${o.status === "PAID" ? "bg-green-100 text-green-700" : o.status === "CANCELLED" ? "bg-gray-200" : "bg-yellow-100 text-yellow-700"}">${o.status}</span>
            </div>
            <p class="text-sm text-gray-500">${new Date(o.created_at).toLocaleString()} · ${o.items.length} ítems</p>
            <p class="font-bold">${formatMoney(o.total)}</p>
            <ul class="text-sm text-gray-600 mt-1">${o.items.map(i => `<li>${i.product_id} × ${i.quantity} @ ${formatMoney(i.unit_price)}</li>`).join("")}</ul>
            ${o.status === "PENDING" ? `<button data-id="${o.id}" class="cancel mt-2 text-red-600 text-sm">Cancelar</button>` : ""}
          </div>`).join("") : "<p class='text-gray-500'>Sin pedidos aún.</p>";
        document.querySelectorAll(".cancel").forEach(b => b.onclick = async () => {
          try { await apiJson(`/api/v1/orders/${b.dataset.id}/cancel`, { method: "POST" }); load(); }
          catch (err) { showMessage(document.getElementById("msg"), "error", err.message); }
        });
      } catch (err) { showMessage(document.getElementById("msg"), "error", err.message); }
    }
  </script>
</body>
</html>
