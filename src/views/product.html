<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de producto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="nav"></div>
  <main class="max-w-3xl mx-auto p-4">
    <div id="msg" class="hidden"></div>
    <div id="detail" class="bg-white p-6 rounded shadow"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    async function load() {
      try {
        const p = await apiJson(`/api/v1/products/${id}`, {}, false);
        document.getElementById("detail").innerHTML = `
          <h1 class="text-2xl font-bold">${p.name}</h1>
          <p class="text-gray-500">${p.brand} · ${p.category} · ⭐ ${p.rating}</p>
          <p class="text-xl mt-3">${p.on_sale && p.sale_price ? `<span class="line-through text-gray-400">${formatMoney(p.price)}</span> ${formatMoney(p.sale_price)}` : formatMoney(p.price)}</p>
          <p class="text-sm mt-1 ${p.stock > 0 ? "text-green-600" : "text-red-600"}">Stock disponible: ${p.stock}</p>
          <div class="mt-4 flex gap-2 items-center">
            <input id="qty" type="number" value="1" min="1" max="${p.stock}" class="w-20 border rounded px-2 py-1">
            <button id="add" class="bg-indigo-600 text-white px-4 py-2 rounded" ${p.stock === 0 ? "disabled" : ""}>Agregar al carrito</button>
          </div>`;
        document.getElementById("add").onclick = async () => {
          if (!currentUser()) { location.href = "login.html"; return; }
          const qty = parseInt(document.getElementById("qty").value, 10);
          if (!qty || qty < 1) { showMessage(document.getElementById("msg"), "error", "Cantidad inválida"); return; }
          try { await apiJson("/api/v1/cart/items", { method: "POST", body: JSON.stringify({ product_id: id, quantity: qty }) }); showMessage(document.getElementById("msg"), "ok", "Agregado al carrito"); }
          catch (err) { showMessage(document.getElementById("msg"), "error", err.message); }
        };
      } catch (err) { showMessage(document.getElementById("msg"), "error", err.message); }
    }
    load();
  </script>
</body>
</html>
