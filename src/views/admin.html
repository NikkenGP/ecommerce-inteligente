<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="nav"></div>
  <main class="max-w-6xl mx-auto p-4">
    <h1 class="text-2xl font-bold my-4">Administración</h1>
    <div id="msg" class="hidden"></div>

    <section class="bg-white p-6 rounded shadow mb-6">
      <h2 class="font-bold mb-3">Crear producto</h2>
      <form id="createForm" class="grid grid-cols-2 md:grid-cols-4 gap-2">
        <input id="name" placeholder="Nombre" required class="border rounded px-2 py-1">
        <input id="price" type="number" step="0.01" min="0.01" placeholder="Precio" required class="border rounded px-2 py-1">
        <input id="stock" type="number" min="0" placeholder="Stock" required class="border rounded px-2 py-1">
        <input id="category" placeholder="Categoría" required class="border rounded px-2 py-1">
        <input id="brand" placeholder="Marca" required class="border rounded px-2 py-1">
        <input id="rating" type="number" step="0.1" min="0" max="5" placeholder="Rating" class="border rounded px-2 py-1">
        <input id="sale_price" type="number" step="0.01" min="0.01" placeholder="Precio oferta" class="border rounded px-2 py-1">
        <label class="flex items-center gap-1 text-sm"><input id="on_sale" type="checkbox"> En oferta</label>
        <button class="col-span-2 md:col-span-4 bg-indigo-600 text-white py-2 rounded">Crear</button>
      </form>
    </section>

    <section class="bg-white p-6 rounded shadow">
      <h2 class="font-bold mb-3">Stock y productos</h2>
      <table class="w-full text-sm">
        <thead><tr class="text-left text-gray-500"><th>Nombre</th><th>Precio</th><th>Stock</th><th>Ajuste</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    if (requireAuth(["Administrador"])) {
      load();
      document.getElementById("createForm").onsubmit = async (e) => {
        e.preventDefault();
        const v = id => document.getElementById(id).value;
        const body = {
          name: v("name"), price: parseFloat(v("price")), stock: parseInt(v("stock"), 10),
          category: v("category"), brand: v("brand"),
          rating: v("rating") ? parseFloat(v("rating")) : 0,
          on_sale: document.getElementById("on_sale").checked,
          sale_price: v("sale_price") ? parseFloat(v("sale_price")) : null,
        };
        try { await apiJson("/api/v1/products", { method: "POST", body: JSON.stringify(body) }); showMessage(document.getElementById("msg"), "ok", "Producto creado"); e.target.reset(); load(); }
        catch (err) { showMessage(document.getElementById("msg"), "error", err.message); }
      };
    }
    async function load() {
      try {
        const data = await apiJson("/api/v1/products?page_size=100", {}, false);
        document.getElementById("rows").innerHTML = data.items.map(p => `
          <tr class="border-t">
            <td class="py-2">${p.name}</td>
            <td>${formatMoney(p.on_sale && p.sale_price ? p.sale_price : p.price)}</td>
            <td>${p.stock}</td>
            <td><input type="number" value="0" data-id="${p.id}" class="delta w-20 border rounded px-2 py-1"></td>
            <td><button data-id="${p.id}" class="apply bg-indigo-600 text-white px-3 py-1 rounded text-xs">Aplicar Δ</button></td>
          </tr>`).join("");
        document.querySelectorAll(".apply").forEach(b => b.onclick = async () => {
          const inp = document.querySelector(`.delta[data-id="${b.dataset.id}"]`);
          const delta = parseInt(inp.value, 10);
          if (!delta) { showMessage(document.getElementById("msg"), "error", "Delta inválido (distinto de 0)"); return; }
          try { await apiJson(`/api/v1/products/${b.dataset.id}/stock`, { method: "PATCH", body: JSON.stringify({ delta }) }); inp.value = 0; showMessage(document.getElementById("msg"), "ok", "Stock actualizado"); load(); }
          catch (err) { showMessage(document.getElementById("msg"), "error", err.message); }
        });
      } catch (err) { showMessage(document.getElementById("msg"), "error", err.message); }
    }
  </script>
</body>
</html>
